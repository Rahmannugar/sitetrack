version: "3"

tasks:
  run-api:
    desc: Run the API on the host using .env
    cmds:
      - go run ./cmd/api

  migrate:
    desc: Apply embedded Tern migrations using .env
    cmds:
      - go run ./cmd/migrate

  run-worker:
    desc: Run the email and OTP cleanup worker
    cmds:
      - go run ./cmd/worker

  generate:
    desc: Generate typed PostgreSQL adapters
    cmds:
      - go -C tools tool sqlc generate -f ../sqlc.yaml

  models:
    desc: Check bounded Regel models with TLC and export TLA files
    preconditions:
      - sh: '"${REGEL_JAVA:-java}" -version >/dev/null 2>&1'
        msg: Set REGEL_JAVA to a Java 21+ executable or put Java on PATH
    env:
      REGEL_TLA2TOOLS: '{{.ROOT_DIR}}/bin/models/tla2tools.jar'
      SITETRACK_MODEL_OUTPUT: '{{.ROOT_DIR}}/bin/models'
    cmds:
      - sh tools/models/setup.sh "{{.ROOT_DIR}}/bin/models/tla2tools.jar"
      - go -C tools test ./models -count=1 -v -timeout=10m

  seed:
    desc: Populate a fresh explicitly selected seed database
    cmds:
      - go run ./cmd/seed {{.CLI_ARGS}}

  verify-endpoints:
    desc: Check every endpoint and SQL plans on a disposable full-scale database copy
    vars:
      DATABASE: '{{.DATABASE | default "sitetrack"}}'
    env:
      SITETRACK_ENDPOINT_SOURCE_DATABASE: '{{.DATABASE}}'
    cmds:
      - sh tests/verification/endpoints.sh

  load-up:
    desc: Start the API and worker on the selected seeded database
    vars:
      DATABASE: '{{.DATABASE | default "sitetrack"}}'
    env:
      SITETRACK_COMPOSE_DATABASE_NAME: '{{.DATABASE}}'
      SITETRACK_RATE_LIMIT_ENABLED: 'false'
      SITETRACK_TELEMETRY_ENABLED: 'false'
    cmds:
      - docker compose up -d --wait
      - docker compose rm -f migrate

  load:
    desc: Run k6 against the seeded API
    vars:
      K6: '{{.K6 | default "k6"}}'
    cmds:
      - '"{{.K6}}" run {{.CLI_ARGS}} tests/load/app.js'

  query-plans:
    desc: Measure application SQL against the seeded database
    vars:
      DATABASE: '{{.DATABASE | default "sitetrack"}}'
    cmds:
      - python3 tests/load/query_plans.py --psql "docker compose exec -T postgres psql -U sitetrack -d {{.DATABASE}}" {{.CLI_ARGS}}

  test-integration:
    desc: Run database tests using SITETRACK_TEST_DATABASE_URL
    preconditions:
      - sh: test -n "$SITETRACK_TEST_DATABASE_URL"
        msg: Set SITETRACK_TEST_DATABASE_URL to an isolated PostgreSQL database
    cmds:
      - go test -p 1 ./internal/infra/database ./internal/authentication ./internal/projects ./internal/tasks ./internal/materials ./internal/inventory ./internal/deliveries ./internal/infra/outbox ./internal/seed -count=1

  db-up:
    desc: Start PostgreSQL and wait for it to become healthy
    cmds:
      - docker compose up -d --wait postgres

  up:
    desc: Start the stack and remove the completed migration container
    cmds:
      - docker compose up -d --wait
      - docker compose rm -f migrate

  up-build:
    desc: Rebuild application images and start the stack
    cmds:
      - docker compose up -d --build --wait
      - docker compose rm -f migrate

  down:
    desc: Stop the stack and retain database contents
    cmds:
      - docker compose down

  logs:
    desc: Follow stack logs
    cmds:
      - docker compose logs -f {{.CLI_ARGS}}

  status:
    desc: Show running and completed Compose services
    cmds:
      - docker compose ps -a

  format:
    desc: Format Go source
    cmds:
      - gofmt -w cmd internal tools/models

  test:
    desc: Run Go tests
    cmds:
      - go test ./...

  build:
    desc: Compile Go commands and packages
    cmds:
      - go build ./...

  check:
    desc: Check formatting, tests, vet, compilation and Compose configuration
    cmds:
      - test -z "$(gofmt -l cmd internal tools/models)"
      - go test ./...
      - go vet ./...
      - go -C tools vet ./models
      - go build ./...
      - docker compose config --quiet
