name: sitetrack

x-application: &application
  image: sitetrack:local
  build:
    context: .
  environment: &application-environment
    SITETRACK_DATABASE_URL: postgres://sitetrack:sitetrack@postgres:5432/sitetrack?sslmode=disable
    SITETRACK_DATABASE_MAX_CONNECTIONS: ${SITETRACK_DATABASE_MAX_CONNECTIONS:-10}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sitetrack
      POSTGRES_PASSWORD: sitetrack
      POSTGRES_DB: sitetrack
    ports:
      - "127.0.0.1:${SITETRACK_DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitetrack -d sitetrack"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *application
    command: ["/app/migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *application
    environment:
      <<: *application-environment
      SITETRACK_HTTP_PORT: "8080"
    ports:
      - "127.0.0.1:${SITETRACK_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  postgres-data:
