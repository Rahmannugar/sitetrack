name: sitetrack

x-application: &application
  image: sitetrack:local
  build:
    context: .
  environment: &application-environment
    SITETRACK_DATABASE_URL: postgres://sitetrack:sitetrack@postgres:5432/sitetrack?sslmode=disable

x-telemetry-environment: &telemetry-environment
  SITETRACK_TELEMETRY_ENABLED: ${SITETRACK_TELEMETRY_ENABLED:-false}
  SITETRACK_ENVIRONMENT: ${SITETRACK_ENVIRONMENT:-development}
  SITETRACK_OTLP_ENDPOINT: ${SITETRACK_OTLP_ENDPOINT:-https://otlp.nr-data.net}
  SITETRACK_OTLP_API_KEY: ${SITETRACK_OTLP_API_KEY:-}
  SITETRACK_TRACE_SAMPLE_RATIO: ${SITETRACK_TRACE_SAMPLE_RATIO:-0.1}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: sitetrack
      POSTGRES_PASSWORD: sitetrack
      POSTGRES_DB: sitetrack
    ports:
      - "127.0.0.1:${SITETRACK_DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sitetrack -d sitetrack"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  migrate:
    <<: *application
    environment:
      <<: *application-environment
      SITETRACK_DATABASE_MIGRATION_MAX_CONNECTIONS: ${SITETRACK_DATABASE_MIGRATION_MAX_CONNECTIONS:-1}
    command: ["/app/migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *application
    environment:
      <<: [*application-environment, *telemetry-environment]
      SITETRACK_HTTP_PORT: "8080"
      SITETRACK_DATABASE_API_MAX_CONNECTIONS: ${SITETRACK_DATABASE_API_MAX_CONNECTIONS:-15}
      SITETRACK_RATE_LIMIT_ENABLED: ${SITETRACK_RATE_LIMIT_ENABLED:-true}
      SITETRACK_OTP_SECRET: ${SITETRACK_OTP_SECRET:-}
      SITETRACK_OUTBOX_ENCRYPTION_KEY: ${SITETRACK_OUTBOX_ENCRYPTION_KEY:-}
      SITETRACK_JWT_SIGNING_SEED: ${SITETRACK_JWT_SIGNING_SEED:-}
      SITETRACK_EMAIL_FROM: ${SITETRACK_EMAIL_FROM:-SiteTrack <onboarding@resend.dev>}
    ports:
      - "127.0.0.1:${SITETRACK_HTTP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 20s
    restart: unless-stopped

  worker:
    <<: *application
    command: ["/app/worker"]
    environment:
      <<: [*application-environment, *telemetry-environment]
      SITETRACK_DATABASE_WORKER_MAX_CONNECTIONS: ${SITETRACK_DATABASE_WORKER_MAX_CONNECTIONS:-10}
      SITETRACK_OUTBOX_ENCRYPTION_KEY: ${SITETRACK_OUTBOX_ENCRYPTION_KEY:-}
      SITETRACK_RESEND_API_KEY: ${SITETRACK_RESEND_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 25s
    restart: unless-stopped

volumes:
  postgres-data:
